<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BA86A"/>
      <stop offset="45%" stop-color="#4A9A5C"/>
      <stop offset="100%" stop-color="#3A7F4A"/>
    </linearGradient>
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F8F3"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1A3D24" flood-opacity="0.28"/>
    </filter>
  </defs>
  
  <!-- Soft Pixel-style rounded background with gentle gradient -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Soft top light reflection for depth (Material / Pixel feel) -->
  <path d="M0 140 Q0 0 128 0 H384 Q512 0 512 140 V160 H0 Z" fill="#FFFFFF" opacity="0.12"/>
  
  <!-- Elegant 2×2 schedule tiles with soft large radius -->
  <g filter="url(#softShadow)">
    <!-- Top-left primary -->
    <rect x="112" y="112" width="132" height="132" rx="40" fill="url(#tile)"/>
    <!-- Top-right secondary -->
    <rect x="268" y="112" width="132" height="132" rx="40" fill="url(#tile)" opacity="0.52"/>
    <!-- Bottom-left secondary -->
    <rect x="112" y="268" width="132" height="132" rx="40" fill="url(#tile)" opacity="0.52"/>
    <!-- Bottom-right primary -->
    <rect x="268" y="268" width="132" height="132" rx="40" fill="url(#tile)"/>
  </g>
  
  <!-- Subtle premium accent dots -->
  <circle cx="178" cy="178" r="5.5" fill="#3A7F4A" opacity="0.28"/>
  <circle cx="334" cy="334" r="5.5" fill="#3A7F4A" opacity="0.28"/>
</svg>
